version: "3.9"

x-app-env: &app-env
  DATA_DIR: /app/data
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-auto}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gpt-4o-mini}
  QDRANT_URL: http://qdrant:6333
  ES_URL: http://elasticsearch:9200
  REDIS_URL: redis://redis:6379/0
  JOB_BACKEND: ${JOB_BACKEND:-thread}

services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: ["es_data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports: ["8000:8000"]
    environment: *app-env
    volumes: ["./data:/app/data"]
    depends_on:
      qdrant: {condition: service_started}
      elasticsearch: {condition: service_started}
      redis: {condition: service_started}

  worker:
    build: .
    command: celery -A graphrag.tasks.celery_app.celery_app worker --loglevel=info --pool=solo
    environment:
      <<: *app-env
      JOB_BACKEND: celery
    volumes: ["./data:/app/data"]
    depends_on:
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
      elasticsearch: {condition: service_started}

volumes:
  qdrant_data:
  es_data:
