[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-rag-engine"
version = "0.1.0"
description = "企业级多源异构文档智能解析与自适应 Graph-RAG 引擎"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
    "networkx>=3.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
full = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "qdrant-client>=1.9",
    "elasticsearch>=8.13",
    "sentence-transformers>=2.7",
    "celery>=5.3",
    "redis>=5.0",
    "ragas>=0.1.9",
    "datasets>=2.19",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["graphrag*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
